name: Deploy (API + site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling one mid-way (a cancelled run could stop
# between a database migration and the worker deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Verify + build the site. No external effects, so a broken frontend stops
  #    the pipeline BEFORE the production database or API are touched.
  build:
    name: Lint, type-check and build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npx eslint . --ignore-pattern worker

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WORKER_URL }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          # Set the repo variable GOOGLE_AUTH=1 once Google OAuth secrets exist on the worker.
          NEXT_PUBLIC_GOOGLE_AUTH: ${{ vars.GOOGLE_AUTH }}
          # Served from the root of imbegnal.com — no basePath prefix.
          NEXT_PUBLIC_BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # 2) API: database migrations, then the Cloudflare Worker. Runs only after the
  #    site verified/built, and BEFORE the site is published, so with credentials
  #    present the frontend never ships ahead of the API it calls. Needs repo
  #    secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
  #    Without them this job passes with a warning and deploys NOTHING, so the
  #    site still publishes ("frontend-only"). Then: GitHub sign-in, lessons, quizzes, notes and progress (saved on this device) keep working; email sign-up, Google sign-in, cloud sync, the AI tutor and account deletion need the new API
  #    (friendly errors until it is deployed). If the secrets exist but a step
  #    FAILS, the pipeline stops and the site is not published.
  #    Production only: a manual run from another branch skips this job (and so
  #    the publish job) instead of migrating the production database.
  worker:
    name: Deploy API (Cloudflare Worker + D1)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      # The token is given only to the steps that need it, never to `npm ci`
      # (dependency install scripts must never see it). Secrets cannot be used
      # in `if:` directly, so this step turns "are they set?" into an output.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=API not deployed::Missing repository secret(s): $missing. The API and database were NOT touched; the site will be published without them (frontend-only). See docs/PLATFORM.md."
            {
              echo "### API not deployed"
              echo "Missing repository secret(s): \`$missing\`. The API and database were not touched, and the site is published without them (frontend-only)."
              echo "Add the secret(s) (see docs/PLATFORM.md) and re-run to deploy the API and database migrations."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install worker dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Type-check worker
        if: steps.creds.outputs.ready == 'true'
        run: npx tsc --noEmit -p .

      # Production's database was first built by hand from the old schema*.sql files. A migration whose
      # columns already exist (schema-v3.sql = 0002) is recorded as applied instead of re-run, which would
      # fail with "duplicate column" and stop the deploy. Changes nothing when it cannot prove that safe.
      - name: Reconcile migrations applied by hand
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1-reconcile.mjs --remote

      - name: Apply D1 migrations (only new ones run)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --config: the site's ../wrangler.jsonc would otherwise win wrangler's config lookup.
        run: npx wrangler d1 migrations apply skillforge-db --remote --config wrangler.toml

      - name: Deploy worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

  # 3) Publish the site (GitHub Pages)
  deploy:
    needs: [build, worker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: Deploy (API + site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling one mid-way (a cancelled run could stop
# between a database migration and the worker deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Verify + build the site. No external effects, so a broken frontend stops
  #    the pipeline BEFORE the production database or API are touched.
  build:
    name: Lint, type-check and build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npx eslint . --ignore-pattern worker

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WORKER_URL }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          # Set the repo variable GOOGLE_AUTH=1 once Google OAuth secrets exist on the worker.
          NEXT_PUBLIC_GOOGLE_AUTH: ${{ vars.GOOGLE_AUTH }}
          # Served from the root of imbegnal.com — no basePath prefix.
          NEXT_PUBLIC_BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # 2) API: database migrations, then the Cloudflare Worker. Runs only after the
  #    site verified/built, and BEFORE the site is published, so with credentials
  #    present the frontend never ships ahead of the API it calls. Needs repo
  #    secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
  #    Without them this job passes with a warning and deploys NOTHING, so the
  #    site still publishes ("frontend-only"). The new frontend degrades
  #    gracefully against the previous API: GitHub sign-in, progress and
  #    bookmarks keep working; email sign-up, Google sign-in, cross-device sync
  #    and the AI tutor need the new API and show friendly errors until it is
  #    deployed. If the secrets exist but a step FAILS, the pipeline stops and
  #    the site is not published.
  #    Production only: a manual run from another branch skips this job (and so
  #    the publish job) instead of migrating the production database.
  worker:
    name: Deploy API (Cloudflare Worker + D1)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      # The token is given only to the steps that need it, never to `npm ci`
      # (dependency install scripts must never see it). Secrets cannot be used
      # in `if:` directly, so this step turns "are they set?" into an output.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=API not deployed::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so the API and database were NOT touched. The site still publishes (frontend-only): email sign-up, Google sign-in, sync and the AI tutor need the new API. See docs/PLATFORM.md."
            {
              echo "### API not deployed"
              echo "Repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are missing, so this run published the **site only**."
              echo "Add them (see docs/PLATFORM.md) and re-run to deploy the API and database migrations."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install worker dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Type-check worker
        if: steps.creds.outputs.ready == 'true'
        run: npx tsc --noEmit -p .

      - name: Apply D1 migrations (only new ones run)
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply skillforge-db --remote

      - name: Deploy worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  # 3) Publish the site (GitHub Pages)
  deploy:
    needs: [build, worker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: Deploy (API + site)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling one mid-way (a cancelled run could stop
# between a database migration and the worker deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) API first: database migrations, then the Cloudflare Worker. The site is
  #    only built after this succeeds, so the frontend never ships ahead of the
  #    API it calls. Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
  worker:
    name: Deploy API (Cloudflare Worker + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/PLATFORM.md). Nothing was deployed."
            exit 1
          fi

      - name: Type-check worker
        run: npx tsc --noEmit -p .

      - name: Apply D1 migrations (only new ones run)
        run: npx wrangler d1 migrations apply skillforge-db --remote

      - name: Deploy worker
        run: npx wrangler deploy

  # 2) Site: static export to GitHub Pages
  build:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npx eslint . --ignore-pattern worker

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WORKER_URL }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          # Set the repo variable GOOGLE_AUTH=1 once Google OAuth secrets exist on the worker.
          NEXT_PUBLIC_GOOGLE_AUTH: ${{ vars.GOOGLE_AUTH }}
          # Served from the root of imbegnal.com — no basePath prefix.
          NEXT_PUBLIC_BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
